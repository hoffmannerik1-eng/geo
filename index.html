<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050507">
<title>Geometry Rush</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050507;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  font:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

#login{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,255,140,.12),transparent 35%),
    #050507;
}

.loginCard{
  width:min(430px,92%);
  padding:40px 28px;
  text-align:center;
  border-radius:28px;
  background:rgba(12,14,16,.92);
  border:1px solid rgba(69,255,154,.25);
  box-shadow:
    0 0 80px rgba(69,255,154,.1),
    inset 0 0 50px rgba(255,255,255,.015);
  backdrop-filter:blur(20px);
}

.logo{
  font-size:clamp(38px,10vw,58px);
  font-weight:1000;
  letter-spacing:5px;
  color:#45ff9a;
  text-shadow:
    0 0 20px #45ff9a,
    0 0 60px rgba(69,255,154,.3);
}

.logoSub{
  margin-top:8px;
  color:#777;
  letter-spacing:5px;
  font-size:11px;
}

.google{
  width:100%;
  margin-top:32px;
  padding:16px;
  border-radius:14px;
  background:#fff;
  color:#111;
  font-weight:900;
}

.loginError{
  min-height:20px;
  margin-top:15px;
  color:#ff5b67;
  font-size:13px;
}

/* ================= APP ================= */

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ================= TOP HUD ================= */

.top{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  height:90px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.8),
    transparent
  );
  pointer-events:none;
}

.brand{
  color:#45ff9a;
  font-size:15px;
  font-weight:1000;
  letter-spacing:4px;
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:37px;
  height:37px;
  border-radius:50%;
  border:2px solid #45ff9a;
}

.name{
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#aaa;
  font-size:13px;
}

/* ================= HUD ================= */

.hud{
  position:absolute;
  z-index:20;
  top:90px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  pointer-events:none;
}

.stat{
  min-width:105px;
  padding:8px 14px;
  text-align:center;
  background:rgba(5,8,7,.72);
  border:1px solid rgba(69,255,154,.2);
  border-radius:13px;
  backdrop-filter:blur(10px);
}

.statLabel{
  color:#666;
  font-size:8px;
  letter-spacing:2px;
}

.statValue{
  margin-top:3px;
  color:#45ff9a;
  font-size:21px;
  font-weight:1000;
}

/* ================= START ================= */

.start{
  position:absolute;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
}

.startTitle{
  font-size:clamp(50px,12vw,110px);
  font-weight:1000;
  letter-spacing:10px;
  color:#fff;
  text-shadow:
    0 0 10px #45ff9a,
    0 0 40px rgba(69,255,154,.5);
}

.startTitle span{
  color:#45ff9a;
}

.startHint{
  margin-top:12px;
  color:#777;
  letter-spacing:3px;
  font-size:11px;
}

/* ================= MENU ================= */

.menu{
  position:absolute;
  z-index:30;
  left:20px;
  bottom:20px;
  display:flex;
  gap:8px;
}

.menu button{
  padding:11px 15px;
  color:#aaa;
  background:rgba(8,10,10,.8);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
}

.menu button:hover{
  color:#45ff9a;
  border-color:rgba(69,255,154,.3);
}

/* ================= OVER ================= */

#gameOver{
  position:absolute;
  z-index:100;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px);
}

.overCard{
  width:min(430px,90%);
  padding:32px;
  text-align:center;
  border-radius:25px;
  background:#090b0c;
  border:1px solid rgba(69,255,154,.2);
}

.overTitle{
  color:#45ff9a;
  font-size:38px;
  font-weight:1000;
  letter-spacing:3px;
}

.results{
  margin:22px 0;
  line-height:2;
  color:#999;
}

.results strong{
  color:white;
}

.mainBtn{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:#45ff9a;
  color:#031008;
  font-weight:1000;
}

.darkBtn{
  width:100%;
  margin-top:9px;
  padding:13px;
  border-radius:13px;
  color:#aaa;
  background:#151718;
}

/* ================= MODALS ================= */

.modal{
  position:absolute;
  z-index:200;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(15px);
}

.modalCard{
  width:min(700px,100%);
  max-height:86vh;
  overflow:auto;
  padding:25px;
  border-radius:24px;
  background:#090b0c;
  border:1px solid rgba(69,255,154,.22);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modalTitle{
  color:#45ff9a;
  font-size:25px;
  font-weight:1000;
  letter-spacing:2px;
}

.close{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#151718;
  color:#aaa;
  font-size:22px;
}

/* ================= SHOP ================= */

.shopGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.skin{
  padding:18px 12px;
  text-align:center;
  background:#0e1112;
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
}

.skinIcon{
  width:55px;
  height:55px;
  margin:4px auto 16px;
  border-radius:9px;
  transform:rotate(45deg);
}

.skinName{
  font-size:13px;
  font-weight:900;
}

.skinPrice{
  margin:7px 0;
  color:#666;
  font-size:11px;
}

.skinBtn{
  width:100%;
  padding:9px;
  border-radius:9px;
  background:#45ff9a;
  color:#06100a;
  font-size:11px;
  font-weight:900;
}

.skinBtn.selected{
  background:#151718;
  color:#45ff9a;
}

/* ================= RANKING ================= */

.rank{
  display:grid;
  grid-template-columns:50px 1fr 120px;
  align-items:center;
  padding:13px;
  margin-bottom:7px;
  border-radius:12px;
  background:#0e1112;
}

.rankPos{
  color:#555;
  font-weight:1000;
}

.rankName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.rankScore{
  text-align:right;
  color:#45ff9a;
  font-weight:1000;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .top{
    padding:12px;
  }

  .name{
    display:none;
  }

  .hud{
    top:78px;
    gap:5px;
  }

  .stat{
    min-width:76px;
    padding:7px 6px;
  }

  .statValue{
    font-size:17px;
  }

  .statLabel{
    font-size:7px;
  }

  .shopGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    left:10px;
    bottom:10px;
  }

  .menu button{
    padding:10px 11px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div class="loginCard">

    <div class="logo">
      GEOMETRY
    </div>

    <div class="logoSub">
      RUSH // GLOBAL
    </div>

    <button id="loginBtn" class="google">

    </button>

    <div id="loginError" class="loginError"></div>

  </div>

</div>


<!-- GAME -->

<div id="game" class="hidden">

  <div class="top">

    <div class="brand">

    </div>

    <div class="account">

      <div id="playerName" class="name">

  <div id="rankingModal" class="modal hidden">

    <div class="modalCard">

      <div class="modalHeader">

        <div class="modalTitle">
          GLOBAL RANGLISTE
        </div>

        <button
          class="close"
          onclick="closeModal('rankingModal')"
        >
          ×
        </button>

      </div>

      <div id="rankingList">
        Lade Rangliste...
      </div>

    </div>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

import {
  getFunctions,
  httpsCallable
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";


const firebaseConfig = {
  apiKey: "AIzaSyAqCjm8rb3YOqCIgdtG2fSzrQatUytn2-c",
  authDomain: "geo2-0.firebaseapp.com",
  projectId: "geo2-0",
  storageBucket: "geo2-0.firebasestorage.app",
  messagingSenderId: "229525498291",
  appId: "1:229525498291:web:69556b9eb4d89489e283c6"
};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);

const functions =
  getFunctions(
    firebaseApp,
    "europe-west1"
  );


const ensurePlayer =
  httpsCallable(
    functions,
    "ensurePlayer"
  );

const submitRun =
  httpsCallable(
    functions,
    "submitRun"
  );

const buySkin =
  httpsCallable(
    functions,
    "buySkin"
  );

const selectSkin =
  httpsCallable(
    functions,
    "selectSkin"
  );


/* =====================================================
   ELEMENTE
===================================================== */

const login =
  document.getElementById("login");

const game =
  document.getElementById("game");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const playerName =
  document.getElementById("playerName");

const avatar =
  document.getElementById("avatar");

const scoreEl =
  document.getElementById("score");

const bestEl =
  document.getElementById("best");

const coinsEl =
  document.getElementById("coins");

const start =
  document.getElementById("start");

const gameOver =
  document.getElementById("gameOver");

const finalScore =
  document.getElementById("finalScore");

const finalBest =
  document.getElementById("finalBest");

const earnedCoins =
  document.getElementById("earnedCoins");

const shopGrid =
  document.getElementById("shopGrid");

const rankingList =
  document.getElementById("rankingList");


/* =====================================================
   PLAYER
===================================================== */

let currentUser = null;

let player = {
  name:"Player",
  highscore:0,
  coins:0,
  skin:"green",
  ownedSkins:["green"]
};


/* =====================================================
   SKINS
===================================================== */

const skins = [

  {
    id:"green",
    name:"NEON",
    price:0,
    color:"#45ff9a"
  },

  {
    id:"cyan",
    name:"CYBER",
    price:50,
    color:"#32e8ff"
  },

  {
    id:"purple",
    name:"VOID",
    price:100,
    color:"#a95cff"
  },

  {
    id:"orange",
    name:"FIRE",
    price:200,
    color:"#ff7b32"
  },

  {
    id:"pink",
    name:"LASER",
    price:350,
    color:"#ff42c8"
  },

  {
    id:"white",
    name:"GHOST",
    price:600,
    color:"#ffffff"
  },

  {
    id:"gold",
    name:"GOLD",
    price:1000,
    color:"#ffd84d"
  },

  {
    id:"red",
    name:"INFERNO",
    price:2000,
    color:"#ff3c4a"
  }

];


/* =====================================================
   LOGIN
===================================================== */

loginBtn.onclick =
async () => {

  loginError.textContent = "";

  loginBtn.disabled = true;
  loginBtn.textContent =
    "ANMELDUNG...";

  try{

    const provider =
      new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await signInWithPopup(
      auth,
      provider
    );

  }catch(error){

    console.error(error);

    if(
      error.code ===
      "auth/popup-blocked"
    ){

      try{

        const provider =
          new GoogleAuthProvider();

        await signInWithRedirect(
          auth,
          provider
        );

        return;

      }catch(e){

        showLoginError(e);

      }

    }else{

      showLoginError(error);

    }

  }finally{

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Mit Google anmelden";

  }

};


function showLoginError(error){

  const code =
    error?.code || "";

  const messages = {

    "auth/configuration-not-found":
      "Firebase Authentication ist nicht eingerichtet.",

    "auth/operation-not-allowed":
      "Google-Anmeldung ist in Firebase nicht aktiviert.",

    "auth/unauthorized-domain":
      "Deine GitHub-Pages-Domain muss in Firebase unter Authorized domains eingetragen werden.",

    "auth/invalid-api-key":
      "Der Firebase API-Key ist ungültig.",

    "auth/network-request-failed":
      "Netzwerkfehler."

  };

  loginError.innerHTML =
    `${messages[code] || "Anmeldung fehlgeschlagen."}
    <br>
    <small>${code}</small>`;

}


try{

  await getRedirectResult(auth);

}catch(error){

  if(error){
    console.error(error);
  }

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;

      login.classList.remove(
        "hidden"
      );

      game.classList.add(
        "hidden"
      );

      return;

    }

    currentUser = user;

    login.classList.add(
      "hidden"
    );

    game.classList.remove(
      "hidden"
    );

    playerName.textContent =
      user.displayName ||
      "Player";

    if(user.photoURL){

      avatar.src =
        user.photoURL;

    }

    await loadPlayer();

    startRanking();

  }
);


/* =====================================================
   PLAYER LADEN
===================================================== */

async function loadPlayer(){

  try{

    await ensurePlayer();

  }catch(error){

    console.error(
      "ensurePlayer:",
      error
    );

  }


  try{

    const ref =
      doc(
        db,
        "players",
        currentUser.uid
      );

    const snap =
      await getDoc(ref);

    if(snap.exists()){

      const data =
        snap.data();

      player = {

        name:
          data.name ||
          currentUser.displayName ||
          "Player",

        highscore:
          Number(
            data.highscore || 0
          ),

        coins:
          Number(
            data.coins || 0
          ),

        skin:
          data.skin ||
          "green",

        ownedSkins:
          Array.isArray(
            data.ownedSkins
          )
          ?
          data.ownedSkins
          :
          ["green"]

      };

    }

  }catch(error){

    console.error(
      "Player:",
      error
    );

  }

  updateHUD();
  renderShop();

}


function updateHUD(){

  bestEl.textContent =
    player.highscore.toLocaleString(
      "de-DE"
    );

  coinsEl.textContent =
    player.coins.toLocaleString(
      "de-DE"
    );

}


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById("home")
  .onclick = () => {

    gameOver.classList.add(
      "hidden"
    );

    start.classList.remove(
      "hidden"
    );

  };


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

  DPR =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W*DPR;

  canvas.height =
    H*DPR;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   GAME
===================================================== */

let running = false;

let score = 0;

let distance = 0;

let speed = 7;

let difficulty = 1;

let playerX = 0;

let playerY = 0;

let playerSize = 34;

let velocityY = 0;

let grounded = false;

let canJump = true;

let rotation = 0;

let platforms = [];

let spikes = [];

let particles = [];

let lastTime = 0;

let spawnX = 0;

let cameraX = 0;


/* =====================================================
   LEVEL GENERATION
===================================================== */

function resetLevel(){

  platforms = [];
  spikes = [];

  const ground =
    H * .78;

  /*
    Startplattform
  */

  platforms.push({

    x:0,
    y:ground,
    w:900,
    h:40,
    safe:true

  });

  spawnX = 900;

}


function generateLevel(){

  while(
    spawnX <
    cameraX + W + 900
  ){

    const gap =
      60 +
      Math.random()*90;

    const width =
      150 +
      Math.random()*180;

    const y =
      H*.55 +
      Math.random()*H*.18;

    const platform = {

      x:
        spawnX + gap,

      y:y,

      w:width,

      h:30,

      safe:true

    };

    platforms.push(
      platform
    );


    /*
      Rote Plattform =
      darf NICHT betreten werden.
    */

    if(
      Math.random() <
      Math.min(
        .25 + difficulty*.035,
        .7
      )
    ){

      const redX =
        platform.x +
        20 +
        Math.random()*
        Math.max(
          10,
          platform.w-60
        );

      spikes.push({

        x:redX,

        y:
          platform.y-28,

        w:28,

        h:28

      });

    }


    /*
      Boden-Spikes zwischen Plattformen
    */

    if(
      Math.random() <
      Math.min(
        .35 + difficulty*.02,
        .75
      )
    ){

      spikes.push({

        x:
          spawnX +
          gap/2,

        y:
          H*.78-32,

        w:
          32,

        h:
          32

      });

    }


    spawnX =
      platform.x +
      platform.w;

  }

}


/* =====================================================
   PARTICLES
===================================================== */

function particleBurst(
  x,
  y,
  amount=15
){

  for(
    let i=0;
    i<amount;
    i++
  ){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:1,

      size:
        2+Math.random()*5

    });

  }

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(!running){

    startGame();

    return;

  }

  /*
    NUR EIN SPRUNG.

    canJump wird erst wieder true,
    wenn der Spieler wirklich
    auf einer Plattform landet.
  */

  if(
    grounded &&
    canJump
  ){

    velocityY =
      -13.5;

    grounded =
      false;

    canJump =
      false;

    particleBurst(
      playerX-cameraX+17,
      playerY+34,
      10
    );

  }

}


window.addEventListener(
  "keydown",
  event => {

    if(
      event.code === "Space" ||
      event.code === "ArrowUp"
    ){

      event.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(
        "button"
      ) ||
      event.target.closest(
        ".modal"
      )
    ){

      return;

    }

    jump();

  }
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  running = true;

  score = 0;

  distance = 0;

  speed = 7;

  difficulty = 1;

  velocityY = 0;

  rotation = 0;

  cameraX = 0;

  playerX = 180;

  playerY =
    H*.78-playerSize;

  grounded = true;

  canJump = true;

  lastTime =
    performance.now();

  resetLevel();

  start.classList.add(
    "hidden"
  );

  gameOver.classList.add(
    "hidden"
  );

  scoreEl.textContent =
    "0";

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   COLLISION
===================================================== */

function rectsOverlap(
  a,
  b
){

  return (

    a.x <
      b.x+b.w &&

    a.x+a.w >
      b.x &&

    a.y <
      b.y+b.h &&

    a.y+a.h >
      b.y

  );

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  /*
    Geschwindigkeit steigt immer weiter.
  */

  distance +=
    speed*dt;

  score =
    Math.floor(
      distance/10
    );

  difficulty =
    1 +
    score/600;

  speed =
    Math.min(
      7 +
      difficulty*1.5,
      19
    );

  scoreEl.textContent =
    score.toLocaleString(
      "de-DE"
    );


  /*
    Kamera folgt dem Spieler.
  */

  playerX +=
    speed*dt;

  cameraX =
    playerX -
    W*.2;


  generateLevel();


  /*
    Schwerkraft
  */

  velocityY +=
    .72*dt;

  const oldY =
    playerY;

  playerY +=
    velocityY*dt;

  grounded = false;


  const playerWorld = {

    x:
      playerX,

    y:
      playerY,

    w:
      playerSize,

    h:
      playerSize

  };


  /*
    Plattform-Landung

    Wichtig:
    Nur von oben.
  */

  for(
    const p of platforms
  ){

    const previousBottom =
      oldY+playerSize;

    const currentBottom =
      playerY+playerSize;

    if(

      playerX+playerSize >
        p.x &&

      playerX <
        p.x+p.w &&

      previousBottom <= p.y+5 &&

      currentBottom >= p.y &&

      velocityY >= 0

    ){

      playerY =
        p.y-playerSize;

      velocityY = 0;

      grounded = true;

      canJump = true;

      break;

    }

  }


  /*
    Wenn wir runterfallen:
    Game Over.
  */

  if(
    playerY >
    H+100
  ){

    endGame();

    return;

  }


  /*
    Rote Gefahren
  */

  for(
    const spike of spikes
  ){

    const s = {

      x:spike.x,

      y:spike.y,

      w:spike.w,

      h:spike.h

    };

    if(
      rectsOverlap(
        playerWorld,
        s
      )
    ){

      endGame();

      return;

    }

  }


  /*
    Alte Plattformen entfernen.
  */

  platforms =
    platforms.filter(
      p =>
        p.x+p.w >
        cameraX-500
    );

  spikes =
    spikes.filter(
      s =>
        s.x+s.w >
        cameraX-500
    );


  /*
    Partikel
  */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x +=
      p.vx*dt;

    p.y +=
      p.vy*dt;

    p.vy +=
      .2*dt;

    p.life -=
      .045*dt;

    if(
      p.life <= 0
    ){

      particles.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Hintergrund
  */

  const bg =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  bg.addColorStop(
    0,
    "#030507"
  );

  bg.addColorStop(
    .55,
    "#07110d"
  );

  bg.addColorStop(
    1,
    "#020303"
  );

  ctx.fillStyle =
    bg;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Neon-Kreis im Hintergrund
  */

  const glow =
    ctx.createRadialGradient(
      W*.5,
      H*.45,
      10,
      W*.5,
      H*.45,
      H*.55
    );

  glow.addColorStop(
    0,
    "rgba(69,255,154,.10)"
  );

  glow.addColorStop(
    1,
    "rgba(69,255,154,0)"
  );

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
    Grid
  */

  ctx.strokeStyle =
    "rgba(69,255,154,.055)";

  ctx.lineWidth = 1;

  const grid = 60;

  const offset =
    -(cameraX*.35)%grid;

  for(
    let x=offset;
    x<W;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      H*.2
    );

    ctx.lineTo(
      x,
      H*.78
    );

    ctx.stroke();

  }

  for(
    let y=H*.2;
    y<H*.78;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }


  /*
    Boden
  */

  ctx.fillStyle =
    "#07110c";

  ctx.fillRect(
    0,
    H*.78,
    W,
    H*.22
  );


  /*
    Plattformen
  */

  for(
    const p of platforms
  ){

    const x =
      p.x-cameraX;

    if(
      x > W+100 ||
      x+p.w < -100
    ) continue;


    ctx.save();

    ctx.shadowColor =
      "#45ff9a";

    ctx.shadowBlur =
      18;

    ctx.fillStyle =
      "#45ff9a";

    ctx.fillRect(
      x,
      p.y,
      p.w,
      p.h
    );

    ctx.shadowBlur = 0;

    ctx.fillStyle =
      "#07100b";

    ctx.fillRect(
      x+5,
      p.y+7,
      p.w-10,
      p.h-7
    );

    /*
      kleine Leuchtlinien
    */

    ctx.fillStyle =
      "rgba(255,255,255,.35)";

    ctx.fillRect(
      x+8,
      p.y+3,
      p.w-16,
      2
    );

    ctx.restore();

  }


  /*
    ROTE GEFAHREN
  */

  for(
    const s of spikes
  ){

    const x =
      s.x-cameraX;

    if(
      x > W+100 ||
      x+s.w < -100
    ) continue;


    ctx.save();

    ctx.shadowColor =
      "#ff304f";

    ctx.shadowBlur =
      20;

    ctx.fillStyle =
      "#ff304f";

    ctx.beginPath();

    ctx.moveTo(
      x,
      s.y+s.h
    );

    ctx.lineTo(
      x+s.w/2,
      s.y
    );

    ctx.lineTo(
      x+s.w,
      s.y+s.h
    );

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle =
      "#24070b";

    ctx.beginPath();

    ctx.moveTo(
      x+7,
      s.y+s.h-5
    );

    ctx.lineTo(
      x+s.w/2,
      s.y+8
    );

    ctx.lineTo(
      x+s.w-7,
      s.y+s.h-5
    );

    ctx.closePath();

    ctx.fill();

    ctx.restore();

  }


  /*
    Spieler
  */

  const skin =
    skins.find(
      s =>
        s.id === player.skin
    ) || skins[0];

  const px =
    playerX-cameraX;

  const py =
    playerY;


  ctx.save();

  ctx.translate(
    px+playerSize/2,
    py+playerSize/2
  );

  /*
    Cube dreht sich beim Springen.
  */

  if(!grounded){

    rotation +=
      .14;

  }else{

    rotation =
      Math.round(
        rotation/
        (Math.PI/2)
      )*
      (Math.PI/2);

  }

  ctx.rotate(
    rotation
  );

  ctx.shadowColor =
    skin.color;

  ctx.shadowBlur =
    28;

  ctx.fillStyle =
    skin.color;

  ctx.fillRect(
    -17,
    -17,
    34,
    34
  );

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "#050706";

  ctx.fillRect(
    -9,
    -9,
    18,
    18
  );

  ctx.fillStyle =
    "rgba(255,255,255,.8)";

  ctx.fillRect(
    -5,
    -7,
    4,
    4
  );

  ctx.fillRect(
    4,
    -7,
    4,
    4
  );

  ctx.restore();


  /*
    Partikel
  */

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      p.life;

    ctx.fillStyle =
      "#45ff9a";

    ctx.fillRect(
      p.x-cameraX,
      p.y,
      p.size,
      p.size
    );

  }

  ctx.globalAlpha = 1;

}


/* =====================================================
   LOOP
===================================================== */

function loop(time){

  if(!running)
    return;

  const dt =
    Math.min(
      (time-lastTime)/16.67,
      2
    );

  lastTime =
    time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   GAME OVER
===================================================== */

async function endGame(){

  if(!running)
    return;

  running = false;

  const earned =
    Math.floor(
      score/100
    );

  finalScore.textContent =
    score.toLocaleString(
      "de-DE"
    );

  finalBest.textContent =
    Math.max(
      player.highscore,
      score
    ).toLocaleString(
      "de-DE"
    );

  earnedCoins.textContent =
    "+"+
    earned;

  gameOver.classList.remove(
    "hidden"
  );


  /*
    SCORE + COINS werden
    serverseitig gespeichert.
  */

  try{

    const result =
      await submitRun({
        score:Math.floor(score)
      });

    const data =
      result.data || {};

    player.highscore =
      Number(
        data.highscore ||
        player.highscore
      );

    player.coins =
      Number(
        data.coins ||
        player.coins
      );

    updateHUD();

  }catch(error){

    console.error(
      "Run speichern:",
      error
    );

  }

}


/* =====================================================
   RETRY
===================================================== */

document
  .getElementById("retry")
  .onclick =
  () => {

    startGame();

  };


/* =====================================================
   SHOP
===================================================== */

function renderShop(){

  shopGrid.innerHTML = "";

  for(
    const skin of skins
  ){

    const owned =
      player.ownedSkins
        .includes(
          skin.id
        );

    const selected =
      player.skin === skin.id;

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "skin";

    item.innerHTML = `

      <div
        class="skinIcon"
        style="
          background:${skin.color};
          box-shadow:0 0 25px ${skin.color};
        "
      ></div>

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
          ? "STARTER"
          : skin.price+" COINS"
        }
      </div>

      <button
        class="skinBtn ${
          selected ? "selected" : ""
        }"
      >
        ${
          selected
          ? "AUSGEWÄHLT"
          : owned
            ? "AUSWÄHLEN"
            : "KAUFEN"
        }
      </button>

    `;

    const btn =
      item.querySelector(
        ".skinBtn"
      );

    btn.onclick =
    async () => {

      if(selected)
        return;


      if(owned){

        try{

          const result =
            await selectSkin({
              skin:skin.id
            });

          const data =
            result.data;

          player.skin =
            data.skin;

          renderShop();

        }catch(error){

          console.error(error);

          alert(
            "Skin konnte nicht ausgewählt werden."
          );

        }

        return;

      }


      try{

        const result =
          await buySkin({
            skin:skin.id
          });

        const data =
          result.data;

        player.coins =
          Number(
            data.coins
          );

        player.skin =
          data.skin;

        player.ownedSkins =
          data.ownedSkins || [];

        updateHUD();

        renderShop();

      }catch(error){

        console.error(error);

        if(
          error.code ===
          "functions/failed-precondition"
        ){

          alert(
            "Du hast nicht genug Coins."
          );

        }else{

          alert(
            "Kauf konnte nicht durchgeführt werden."
          );

        }

      }

    };

    shopGrid.appendChild(
      item
    );

  }

}


document
  .getElementById("shopBtn")
  .onclick =
  () => {

    renderShop();

    document
      .getElementById("shopModal")
      .classList.remove(
        "hidden"
      );

  };


/* =====================================================
   RANGLISTE
===================================================== */

let rankingUnsubscribe =
  null;

function startRanking(){

  if(rankingUnsubscribe){

    rankingUnsubscribe();

  }

  const q =
    query(

      collection(
        db,
        "players"
      ),

      orderBy(
        "highscore",
        "desc"
      ),

      limit(100)

    );


  rankingUnsubscribe =
    onSnapshot(

      q,

      snapshot => {

        let html = "";

        let pos = 1;

        snapshot.forEach(
          docSnap => {

            const data =
              docSnap.data();

            const name =
              data.name ||
              "Player";

            const score =
              Number(
                data.highscore || 0
              );

            html += `

              <div class="rank">

                <div class="rankPos">
                  #${pos}
                </div>

                <div class="rankName">
                  ${escapeHtml(name)}
                </div>

                <div class="rankScore">
                  ${score.toLocaleString("de-DE")}
                </div>

              </div>

            `;

            pos++;

          }
        );


        if(!html){

          html =
            `<div style="color:#666">
              Noch keine Scores vorhanden.
            </div>`;

        }

        rankingList.innerHTML =
          html;

      },

      error => {

        console.error(
          "Rangliste:",
          error
        );

        rankingList.innerHTML =
          "Rangliste konnte nicht geladen werden.";

      }

    );

}


document
  .getElementById("rankingBtn")
  .onclick =
  () => {

    document
      .getElementById("rankingModal")
      .classList.remove(
        "hidden"
      );

  };


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


window.closeModal =
function(id){

  document
    .getElementById(id)
    .classList.add(
      "hidden"
    );

};


/* ESC */

window.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(".modal")
        .forEach(
          m =>
            m.classList.add(
              "hidden"
            )
        );

    }

  }
);
