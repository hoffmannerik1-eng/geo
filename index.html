<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>GEOMETRY // RUSH</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 35%,rgba(40,255,150,.08),transparent 35%),
    #050505;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at center,rgba(69,255,154,.12),transparent 32%),
    #050505;
}

.loginBox{
  width:min(430px,100%);
  padding:40px 28px;
  text-align:center;
  border:1px solid rgba(69,255,154,.25);
  border-radius:28px;
  background:rgba(10,15,13,.88);
  box-shadow:
    0 0 70px rgba(69,255,154,.08),
    inset 0 0 40px rgba(69,255,154,.025);
  backdrop-filter:blur(20px);
}

.logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:5px;
  color:#45ff9a;
  text-shadow:0 0 30px rgba(69,255,154,.55);
}

.subtitle{
  margin-top:10px;
  color:#777;
  font-size:13px;
  letter-spacing:3px;
}

.googleBtn{
  width:100%;
  margin-top:35px;
  padding:16px;
  border-radius:14px;
  background:white;
  color:#111;
  font-weight:800;
  transition:.2s;
}

.googleBtn:hover{
  transform:translateY(-2px);
}

.googleBtn:active{
  transform:scale(.98);
}

#errorBox{
  margin-top:16px;
  color:#ff6262;
  font-size:13px;
  line-height:1.5;
}

/* APP */

#app{
  width:100%;
  height:100%;
  position:relative;
}

.topbar{
  position:absolute;
  z-index:20;
  top:0;
  left:0;
  right:0;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent);
}

.brand{
  font-weight:1000;
  letter-spacing:3px;
  color:#45ff9a;
}

.user{
  display:flex;
  align-items:center;
  gap:10px;
}

.user img{
  width:36px;
  height:36px;
  border-radius:50%;
  border:2px solid #45ff9a;
}

.logout{
  background:#111;
  color:#aaa;
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
}

/* HUD */

.hud{
  position:absolute;
  z-index:10;
  top:82px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
}

.stat{
  min-width:105px;
  padding:10px 16px;
  text-align:center;
  border:1px solid rgba(69,255,154,.2);
  border-radius:13px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
}

.statLabel{
  font-size:9px;
  color:#666;
  letter-spacing:2px;
}

.statValue{
  margin-top:3px;
  font-size:22px;
  font-weight:1000;
  color:#45ff9a;
}

/* GAME */

#gameCanvas{
  width:100%;
  height:100%;
  display:block;
  background:#050505;
}

#startPanel{
  position:absolute;
  z-index:15;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
}

.gameTitle{
  font-size:clamp(42px,10vw,92px);
  font-weight:1000;
  letter-spacing:8px;
  color:#45ff9a;
  text-shadow:
    0 0 20px rgba(69,255,154,.5),
    0 0 60px rgba(69,255,154,.2);
}

.gameHint{
  margin-top:14px;
  color:#777;
  font-size:13px;
  letter-spacing:2px;
}

#gameOver{
  position:absolute;
  z-index:30;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.gameOverBox{
  width:min(420px,90%);
  text-align:center;
  padding:32px;
  border:1px solid rgba(69,255,154,.25);
  border-radius:24px;
  background:#090d0b;
}

.overTitle{
  font-size:38px;
  font-weight:1000;
  color:#45ff9a;
}

.result{
  margin:20px 0;
  color:#aaa;
  line-height:2;
}

.mainBtn{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:#45ff9a;
  color:#031008;
  font-weight:1000;
  box-shadow:0 0 30px rgba(69,255,154,.2);
}

.secondaryBtn{
  width:100%;
  margin-top:10px;
  padding:13px;
  border-radius:13px;
  background:#111;
  color:#aaa;
}

/* SIDE MENU */

.menu{
  position:absolute;
  z-index:25;
  left:18px;
  bottom:18px;
  display:flex;
  gap:9px;
}

.menuBtn{
  padding:11px 15px;
  border-radius:12px;
  background:rgba(10,10,10,.8);
  color:#aaa;
  border:1px solid rgba(255,255,255,.08);
}

.menuBtn:hover{
  color:#45ff9a;
}

/* MODALS */

.modal{
  position:absolute;
  z-index:50;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(12px);
}

.modalBox{
  width:min(650px,100%);
  max-height:85vh;
  overflow:auto;
  padding:25px;
  border:1px solid rgba(69,255,154,.2);
  border-radius:22px;
  background:#090d0b;
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modalTitle{
  color:#45ff9a;
  font-size:25px;
  font-weight:1000;
}

.close{
  background:#151515;
  color:#aaa;
  width:35px;
  height:35px;
  border-radius:10px;
}

/* SHOP */

.shopGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.skin{
  padding:15px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:15px;
  background:#0d1110;
  text-align:center;
}

.skinPreview{
  width:55px;
  height:55px;
  margin:auto;
  margin-bottom:10px;
  transform:rotate(45deg);
  border-radius:7px;
}

.skinName{
  font-weight:800;
  font-size:13px;
}

.skinPrice{
  color:#777;
  font-size:12px;
  margin:6px 0;
}

.skin button{
  width:100%;
  padding:9px;
  border-radius:9px;
  background:#45ff9a;
  font-size:11px;
  font-weight:800;
}

.skin button.owned{
  background:#151515;
  color:#45ff9a;
}

/* RANKING */

.rank{
  display:grid;
  grid-template-columns:45px 1fr 100px;
  align-items:center;
  padding:13px;
  margin-bottom:7px;
  border-radius:12px;
  background:#0d1110;
}

.rankNumber{
  color:#555;
  font-weight:900;
}

.rankName{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.rankScore{
  text-align:right;
  color:#45ff9a;
  font-weight:1000;
}

/* MOBILE */

@media(max-width:600px){
  .hud{
    top:78px;
    gap:5px;
  }

  .stat{
    min-width:75px;
    padding:7px 8px;
  }

  .statValue{
    font-size:17px;
  }

  .statLabel{
    font-size:7px;
  }

  .shopGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .brand{
    font-size:13px;
  }

  .user img{
    width:30px;
    height:30px;
  }

  .logout{
    display:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">
  <div class="loginBox">

    <div class="logo">GEOMETRY</div>
    <div class="subtitle">RUSH // GLOBAL</div>

    <button id="googleLogin" class="googleBtn">
      Mit Google anmelden
    </button>

    <div id="errorBox"></div>

  </div>
</div>


<!-- APP -->

<div id="app" class="hidden">

  <div class="topbar">

    <div class="brand">
      GEOMETRY // RUSH
    </div>

    <div class="user">

      <span id="userName"></span>

      <img id="userAvatar" src="" alt="">

      <button id="logoutBtn" class="logout">
        AUSLOGGEN
      </button>

    </div>

  </div>


  <!-- HUD -->

  <div class="hud">

    <div class="stat">
      <div class="statLabel">SCORE</div>
      <div id="score" class="statValue">0</div>
    </div>

    <div class="stat">
      <div class="statLabel">BEST</div>
      <div id="highscore" class="statValue">0</div>
    </div>

    <div class="stat">
      <div class="statLabel">COINS</div>
      <div id="coins" class="statValue">0</div>
    </div>

  </div>


  <canvas id="gameCanvas"></canvas>


  <div id="startPanel">

    <div class="gameTitle">
      RUSH
    </div>

    <div class="gameHint">
      KLICKEN / LEERTASTE / TIPpen zum STARTEN
    </div>

  </div>


  <!-- MENU -->

  <div class="menu">

    <button id="shopBtn" class="menuBtn">
      ◈ SKINS
    </button>

    <button id="rankingBtn" class="menuBtn">
      ★ RANGLISTE
    </button>

  </div>


  <!-- GAME OVER -->

  <div id="gameOver" class="hidden">

    <div class="gameOverBox">

      <div class="overTitle">
        RUN ENDE
      </div>

      <div class="result">

        SCORE:
        <strong id="finalScore">0</strong>
        <br>

        BEST:
        <strong id="finalBest">0</strong>
        <br>

        COINS:
        <strong id="finalCoins">0</strong>

      </div>

      <button id="retryBtn" class="mainBtn">
        NOCHMAL
      </button>

      <button id="backBtn" class="secondaryBtn">
        ZURÜCK
      </button>

    </div>

  </div>


  <!-- SHOP -->

  <div id="shopModal" class="modal hidden">

    <div class="modalBox">

      <div class="modalHeader">

        <div class="modalTitle">
          SKIN SHOP
        </div>

        <button class="close" onclick="closeModal('shopModal')">
          ×
        </button>

      </div>

      <div id="shopGrid" class="shopGrid"></div>

    </div>

  </div>


  <!-- RANKING -->

  <div id="rankingModal" class="modal hidden">

    <div class="modalBox">

      <div class="modalHeader">

        <div class="modalTitle">
          GLOBAL RANGLISTE
        </div>

        <button class="close" onclick="closeModal('rankingModal')">
          ×
        </button>

      </div>

      <div id="rankingList">
        Lade Rangliste...
      </div>

    </div>

  </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

import {
  getFunctions,
  httpsCallable
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";


const firebaseConfig = {
  apiKey: "AIzaSyAqCjm8rb3YOqCIgdtG2fSzrQatUytn2-c",
  authDomain: "geo2-0.firebaseapp.com",
  projectId: "geo2-0",
  storageBucket: "geo2-0.firebasestorage.app",
  messagingSenderId: "229525498291",
  appId: "1:229525498291:web:69556b9eb4d89489e283c6"
};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);

/*
  WICHTIG:
  Deine Cloud Function muss ebenfalls in
  europe-west1 laufen.
*/
const functions = getFunctions(
  firebaseApp,
  "europe-west1"
);

const submitScore = httpsCallable(
  functions,
  "submitScore"
);


/* =====================================================
   ELEMENTE
===================================================== */

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");

const googleLogin = document.getElementById("googleLogin");
const errorBox = document.getElementById("errorBox");

const userName = document.getElementById("userName");
const userAvatar = document.getElementById("userAvatar");

const logoutBtn = document.getElementById("logoutBtn");

const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");
const coinsEl = document.getElementById("coins");

const startPanel = document.getElementById("startPanel");
const gameOver = document.getElementById("gameOver");

const finalScore = document.getElementById("finalScore");
const finalBest = document.getElementById("finalBest");
const finalCoins = document.getElementById("finalCoins");

const retryBtn = document.getElementById("retryBtn");
const backBtn = document.getElementById("backBtn");

const shopBtn = document.getElementById("shopBtn");
const rankingBtn = document.getElementById("rankingBtn");

const shopGrid = document.getElementById("shopGrid");
const rankingList = document.getElementById("rankingList");


/* =====================================================
   PLAYER
===================================================== */

let currentUser = null;

let player = {
  name:"Player",
  highscore:0,
  coins:0,
  skin:"green",
  ownedSkins:["green"]
};


/* =====================================================
   SKINS
===================================================== */

const skins = [

  {
    id:"green",
    name:"NEON",
    price:0,
    color:"#45ff9a"
  },

  {
    id:"blue",
    name:"CYBER",
    price:25,
    color:"#3db7ff"
  },

  {
    id:"purple",
    name:"VOID",
    price:50,
    color:"#b05cff"
  },

  {
    id:"orange",
    name:"FIRE",
    price:100,
    color:"#ff8c42"
  },

  {
    id:"pink",
    name:"LASER",
    price:150,
    color:"#ff4fc3"
  },

  {
    id:"white",
    name:"GHOST",
    price:250,
    color:"#ffffff"
  }

];


/* =====================================================
   LOGIN
===================================================== */

googleLogin.addEventListener("click", async () => {

  errorBox.textContent = "";

  googleLogin.disabled = true;
  googleLogin.textContent = "ANMELDUNG...";

  try {

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await signInWithPopup(auth,provider);

  } catch(error) {

    console.error(error);

    /*
      Falls Safari / Browser Popup blockiert:
      automatisch Redirect versuchen.
    */

    if(
      error.code === "auth/popup-blocked" ||
      error.code === "auth/popup-closed-by-user"
    ){

      try {

        const provider = new GoogleAuthProvider();

        provider.setCustomParameters({
          prompt:"select_account"
        });

        await signInWithRedirect(
          auth,
          provider
        );

        return;

      } catch(e){

        showLoginError(e);

      }

    }else{

      showLoginError(error);

    }

  } finally {

    googleLogin.disabled = false;
    googleLogin.textContent = "Mit Google anmelden";

  }

});


function showLoginError(error){

  const code = error?.code || "";

  let text = "Anmeldung fehlgeschlagen.";

  if(code === "auth/configuration-not-found"){
    text =
      "Firebase Authentication ist noch nicht richtig eingerichtet.";
  }

  if(code === "auth/operation-not-allowed"){
    text =
      "Google-Anmeldung ist in Firebase noch nicht aktiviert.";
  }

  if(code === "auth/unauthorized-domain"){
    text =
      "Diese GitHub-Pages-Domain ist in Firebase nicht freigegeben.";
  }

  if(code === "auth/invalid-api-key"){
    text =
      "Der Firebase API-Key ist ungültig.";
  }

  if(code === "auth/network-request-failed"){
    text =
      "Netzwerkfehler. Prüfe deine Internetverbindung.";
  }

  errorBox.innerHTML =
    `${text}<br><small>${code}</small>`;

}


/* Redirect Ergebnis */

try{

  await getRedirectResult(auth);

}catch(error){

  if(error){

    console.error(error);

  }

}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, async (user) => {

  if(!user){

    currentUser = null;

    loginScreen.classList.remove("hidden");
    app.classList.add("hidden");

    return;

  }

  currentUser = user;

  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  userName.textContent =
    user.displayName || "Player";

  if(user.photoURL){

    userAvatar.src = user.photoURL;

  }

  await loadPlayer();

  startRankingListener();

});


/* =====================================================
   PLAYER DATEN
===================================================== */

async function loadPlayer(){

  if(!currentUser) return;

  const ref = doc(
    db,
    "players",
    currentUser.uid
  );

  try{

    const snap = await getDoc(ref);

    if(snap.exists()){

      const data = snap.data();

      player = {

        name:
          data.name ||
          currentUser.displayName ||
          "Player",

        highscore:
          Number(data.highscore || 0),

        coins:
          Number(data.coins || 0),

        skin:
          data.skin || "green",

        ownedSkins:
          Array.isArray(data.ownedSkins)
            ? data.ownedSkins
            : ["green"]

      };

    }else{

      /*
        Spielerprofil.
        Die Highscore bleibt 0.
      */

      player = {

        name:
          currentUser.displayName ||
          "Player",

        highscore:0,
        coins:0,
        skin:"green",
        ownedSkins:["green"]

      };

      try{

        await setDoc(
          ref,
          {
            name:player.name,
            highscore:0,
            coins:0,
            skin:"green",
            ownedSkins:["green"]
          },
          {merge:true}
        );

      }catch(e){

        console.warn(
          "Profil konnte nicht angelegt werden:",
          e
        );

      }

    }

  }catch(error){

    console.error(
      "Player laden:",
      error
    );

  }

  highscoreEl.textContent =
    player.highscore;

  coinsEl.textContent =
    player.coins;

  renderShop();

}


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* =====================================================
   FIREBASE SCORE
===================================================== */

async function saveHighscore(score){

  if(!currentUser) return;

  try{

    const result =
      await submitScore({
        score:Math.floor(score)
      });

    const data =
      result.data || {};

    const serverHighscore =
      Number(
        data.highscore ||
        player.highscore ||
        0
      );

    player.highscore =
      Math.max(
        player.highscore,
        serverHighscore
      );

    highscoreEl.textContent =
      player.highscore;

  }catch(error){

    console.error(
      "Score konnte nicht gespeichert werden:",
      error
    );

    /*
      Offline / Function noch nicht deployed:
      Lokaler Highscore bleibt trotzdem.
    */

    if(score > player.highscore){

      player.highscore =
        Math.floor(score);

      highscoreEl.textContent =
        player.highscore;

    }

  }

}


/* =====================================================
   RANGLISTE
===================================================== */

let rankingUnsubscribe = null;

function startRankingListener(){

  if(rankingUnsubscribe){

    rankingUnsubscribe();

  }

  const q = query(

    collection(db,"players"),

    orderBy(
      "highscore",
      "desc"
    ),

    limit(100)

  );

  rankingUnsubscribe =
    onSnapshot(
      q,
      snapshot => {

        let html = "";

        let position = 1;

        snapshot.forEach(docSnap => {

          const data =
            docSnap.data();

          const name =
            data.name || "Player";

          const score =
            Number(
              data.highscore || 0
            );

          html += `

            <div class="rank">

              <div class="rankNumber">
                #${position}
              </div>

              <div class="rankName">
                ${escapeHtml(name)}
              </div>

              <div class="rankScore">
                ${score.toLocaleString("de-DE")}
              </div>

            </div>

          `;

          position++;

        });

        if(!html){

          html =
            "<div style='color:#666'>Noch keine Spieler.</div>";

        }

        rankingList.innerHTML =
          html;

      },

      error => {

        console.error(
          "Rangliste:",
          error
        );

        rankingList.innerHTML =
          "Rangliste konnte nicht geladen werden.";

      }

    );

}


function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   GAME ENGINE
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W*dpr;

  canvas.height =
    H*dpr;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   GAME VARIABLES
===================================================== */

let gameRunning = false;

let gameScore = 0;

let runCoins = 0;

let playerY = 0;

let velocityY = 0;

let rotation = 0;

let speed = 6;

let difficulty = 1;

let distance = 0;

let lastTime = 0;

let obstacles = [];

let coinsOnMap = [];

let particles = [];

let stars = [];

let groundY = 0;


/* Sterne */

for(let i=0;i<100;i++){

  stars.push({

    x:Math.random(),
    y:Math.random(),
    size:
      Math.random()*2+0.5,

    speed:
      Math.random()*.5+.1

  });

}


/* =====================================================
   START
===================================================== */

function startGame(){

  gameRunning = true;

  gameScore = 0;

  runCoins = 0;

  velocityY = 0;

  difficulty = 1;

  distance = 0;

  speed = 6;

  obstacles = [];

  coinsOnMap = [];

  particles = [];

  playerY =
    H * .55;

  startPanel.classList.add(
    "hidden"
  );

  gameOver.classList.add(
    "hidden"
  );

  scoreEl.textContent = "0";

  coinsEl.textContent =
    player.coins;

  lastTime =
    performance.now();

  requestAnimationFrame(loop);

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(!gameRunning){

    startGame();

    return;

  }

  velocityY = -12;

  createParticles(
    W*.2,
    playerY,
    8
  );

}


window.addEventListener(
  "keydown",
  e => {

    if(
      e.code === "Space" ||
      e.code === "ArrowUp"
    ){

      e.preventDefault();

      jump();

    }

  }
);


window.addEventListener(
  "pointerdown",
  e => {

    if(
      e.target.closest("button") ||
      e.target.closest(".modal")
    ) return;

    jump();

  }
);


/* =====================================================
   SPAWN
===================================================== */

let spawnTimer = 0;

function spawnObstacle(){

  const ground =
    H*.76;

  const type =
    Math.random();

  if(type < .7){

    const height =
      35 +
      Math.random()*(
        45 +
        difficulty*10
      );

    obstacles.push({

      x:W+80,

      y:ground-height,

      w:
        30 +
        Math.random()*25,

      h:height

    });

  }else{

    const height =
      35 +
      Math.random()*50;

    obstacles.push({

      x:W+80,

      y:ground-height,

      w:70,

      h:height

    });

  }

}


function spawnCoin(){

  coinsOnMap.push({

    x:W+80,

    y:
      H*.45 +
      Math.random()*H*.25,

    r:9,

    collected:false

  });

}


/* =====================================================
   COLLISION
===================================================== */

function collision(a,b){

  return (

    a.x < b.x+b.w &&

    a.x+a.w > b.x &&

    a.y < b.y+b.h &&

    a.y+a.h > b.y

  );

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
  x,
  y,
  amount
){

  for(let i=0;i<amount;i++){

    particles.push({

      x:x,

      y:y,

      vx:
        (Math.random()-.5)*5,

      vy:
        (Math.random()-.5)*5,

      life:1,

      size:
        Math.random()*4+2

    });

  }

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

  if(!gameRunning) return;

  const dt =
    Math.min(
      (time-lastTime)/16.67,
      2
    );

  lastTime =
    time;

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  distance +=
    speed*dt;

  gameScore =
    Math.floor(
      distance/10
    );

  scoreEl.textContent =
    gameScore.toLocaleString(
      "de-DE"
    );

  difficulty =
    1 +
    gameScore/1000;

  speed =
    Math.min(
      6 +
      difficulty*1.3,
      16
    );


  /* Spieler */

  velocityY +=
    .7*dt;

  playerY +=
    velocityY*dt;

  groundY =
    H*.76;

  const playerSize =
    34;

  if(
    playerY+playerSize >=
    groundY
  ){

    playerY =
      groundY-playerSize;

    velocityY = 0;

  }


  /* Spawn */

  spawnTimer -=
    dt;

  const spawnDistance =
    Math.max(
      35,
      90 -
      difficulty*5
    );

  if(
    spawnTimer <= 0
  ){

    spawnObstacle();

    if(
      Math.random() <
      .55
    ){

      spawnCoin();

    }

    spawnTimer =
      spawnDistance;

  }


  /* Hindernisse */

  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    const o =
      obstacles[i];

    o.x -=
      speed*dt;

    const p = {

      x:W*.2,

      y:playerY,

      w:playerSize,

      h:playerSize

    };

    if(
      collision(
        p,
        o
      )
    ){

      endGame();

      return;

    }

    if(
      o.x+o.w < -100
    ){

      obstacles.splice(
        i,
        1
      );

    }

  }


  /* Coins */

  for(
    let i=coinsOnMap.length-1;
    i>=0;
    i--
  ){

    const c =
      coinsOnMap[i];

    c.x -=
      speed*dt;

    if(!c.collected){

      const dx =
        c.x -
        (W*.2+playerSize/2);

      const dy =
        c.y -
        (playerY+playerSize/2);

      const d =
        Math.sqrt(
          dx*dx+dy*dy
        );

      if(d < 25){

        c.collected = true;

        runCoins++;

        createParticles(
          c.x,
          c.y,
          12
        );

      }

    }

    if(
      c.x < -50
    ){

      coinsOnMap.splice(
        i,
        1
      );

    }

  }


  /* Partikel */

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p =
      particles[i];

    p.x +=
      p.vx*dt;

    p.y +=
      p.vy*dt;

    p.life -=
      .04*dt;

    if(
      p.life <= 0
    ){

      particles.splice(
        i,
        1
      );

    }

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* Background */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#020403"
  );

  gradient.addColorStop(
    1,
    "#07100b"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* Sterne */

  for(
    const s of stars
  ){

    let x =
      (s.x*W -
      distance*s.speed*.2)
      % W;

    if(x<0) x+=W;

    ctx.globalAlpha =
      .25+s.size*.12;

    ctx.fillStyle =
      "#45ff9a";

    ctx.fillRect(
      x,
      s.y*H,
      s.size,
      s.size
    );

  }

  ctx.globalAlpha = 1;


  /* Grid */

  ctx.strokeStyle =
    "rgba(69,255,154,.06)";

  ctx.lineWidth = 1;

  const gridSize = 50;

  for(
    let x=0;
    x<W;
    x+=gridSize
  ){

    const gx =
      (x-distance*.5)
      % gridSize;

    ctx.beginPath();

    ctx.moveTo(
      gx,
      H*.25
    );

    ctx.lineTo(
      gx,
      H*.76
    );

    ctx.stroke();

  }


  /* Boden */

  const ground =
    H*.76;

  ctx.fillStyle =
    "#08140e";

  ctx.fillRect(
    0,
    ground,
    W,
    H-ground
  );

  ctx.strokeStyle =
    "#45ff9a";

  ctx.shadowBlur = 18;

  ctx.shadowColor =
    "#45ff9a";

  ctx.beginPath();

  ctx.moveTo(
    0,
    ground
  );

  ctx.lineTo(
    W,
    ground
  );

  ctx.stroke();

  ctx.shadowBlur = 0;


  /* Hindernisse */

  for(
    const o of obstacles
  ){

    ctx.save();

    ctx.fillStyle =
      "#45ff9a";

    ctx.shadowColor =
      "#45ff9a";

    ctx.shadowBlur = 18;

    ctx.fillRect(
      o.x,
      o.y,
      o.w,
      o.h
    );

    ctx.fillStyle =
      "#0b1710";

    ctx.fillRect(
      o.x+5,
      o.y+5,
      Math.max(
        2,
        o.w-10
      ),
      Math.max(
        2,
        o.h-10
      )
    );

    ctx.restore();

  }


  /* Coins */

  for(
    const c of coinsOnMap
  ){

    if(c.collected)
      continue;

    ctx.save();

    ctx.translate(
      c.x,
      c.y
    );

    ctx.rotate(
      performance.now()/400
    );

    ctx.fillStyle =
      "#ffd84a";

    ctx.shadowColor =
      "#ffd84a";

    ctx.shadowBlur = 18;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      c.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  }


  /* Player */

  const px =
    W*.2;

  const size =
    34;

  const skin =
    skins.find(
      s => s.id===player.skin
    ) || skins[0];

  ctx.save();

  ctx.translate(
    px+size/2,
    playerY+size/2
  );

  rotation +=
    velocityY*.008;

  ctx.rotate(
    rotation
  );

  ctx.fillStyle =
    skin.color;

  ctx.shadowColor =
    skin.color;

  ctx.shadowBlur = 25;

  ctx.fillRect(
    -size/2,
    -size/2,
    size,
    size
  );

  ctx.fillStyle =
    "#07100b";

  ctx.fillRect(
    -size/2+7,
    -size/2+7,
    size-14,
    size-14
  );

  ctx.restore();


  /* Partikel */

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      p.life;

    ctx.fillStyle =
      "#45ff9a";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );

  }

  ctx.globalAlpha = 1;

}


/* =====================================================
   GAME OVER
===================================================== */

async function endGame(){

  if(!gameRunning)
    return;

  gameRunning = false;

  const oldBest =
    player.highscore;

  if(
    gameScore >
    player.highscore
  ){

    player.highscore =
      gameScore;

  }

  /*
    Coins werden lokal hinzugefügt.
  */

  player.coins +=
    runCoins;

  highscoreEl.textContent =
    player.highscore;

  coinsEl.textContent =
    player.coins;

  finalScore.textContent =
    gameScore.toLocaleString(
      "de-DE"
    );

  finalBest.textContent =
    player.highscore.toLocaleString(
      "de-DE"
    );

  finalCoins.textContent =
    runCoins;


  /*
    Sichere Highscore-Funktion.
  */

  if(
    gameScore >
    oldBest
  ){

    await saveHighscore(
      gameScore
    );

  }


  /*
    Spielerdaten lokal / Firestore.
  */

  if(currentUser){

    try{

      await setDoc(

        doc(
          db,
          "players",
          currentUser.uid
        ),

        {
          name:
            player.name,

          coins:
            player.coins,

          skin:
            player.skin,

          ownedSkins:
            player.ownedSkins

        },

        {
          merge:true
        }

      );

    }catch(error){

      console.warn(
        "Spielerdaten konnten nicht gespeichert werden.",
        error
      );

    }

  }

  gameOver.classList.remove(
    "hidden"
  );

}


/* =====================================================
   RETRY
===================================================== */

retryBtn.addEventListener(
  "click",
  () => {

    startGame();

  }
);


backBtn.addEventListener(
  "click",
  () => {

    gameOver.classList.add(
      "hidden"
    );

    startPanel.classList.remove(
      "hidden"
    );

  }
);


/* =====================================================
   SHOP
===================================================== */

function renderShop(){

  shopGrid.innerHTML = "";

  for(
    const skin of skins
  ){

    const owned =
      player.ownedSkins
        .includes(skin.id);

    const selected =
      player.skin === skin.id;

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "skin";

    div.innerHTML = `

      <div
        class="skinPreview"
        style="background:${skin.color};
        box-shadow:0 0 25px ${skin.color}">
      </div>

      <div class="skinName">
        ${skin.name}
      </div>

      <div class="skinPrice">
        ${
          skin.price === 0
            ? "STARTER"
            : skin.price+" COINS"
        }
      </div>

      <button
        class="${owned ? "owned" : ""}"
      >
        ${
          selected
            ? "AUSGEWÄHLT"
            : owned
              ? "AUSWÄHLEN"
              : "KAUFEN"
        }
      </button>

    `;

    const button =
      div.querySelector(
        "button"
      );

    button.addEventListener(
      "click",
      () => {

        if(owned){

          player.skin =
            skin.id;

          savePlayer();

          renderShop();

          return;

        }

        if(
          player.coins <
          skin.price
        ){

          alert(
            "Du brauchst mehr Coins!"
          );

          return;

        }

        player.coins -=
          skin.price;

        player.ownedSkins.push(
          skin.id
        );

        player.skin =
          skin.id;

        coinsEl.textContent =
          player.coins;

        savePlayer();

        renderShop();

      }
    );

    shopGrid.appendChild(
      div
    );

  }

}


async function savePlayer(){

  if(!currentUser)
    return;

  try{

    await setDoc(

      doc(
        db,
        "players",
        currentUser.uid
      ),

      {
        name:
          player.name,

        coins:
          player.coins,

        skin:
          player.skin,

        ownedSkins:
          player.ownedSkins

      },

      {
        merge:true
      }

    );

  }catch(error){

    console.error(
      "Speichern:",
      error
    );

  }

}

===================================================== */

highscoreEl.textContent = "0";
coinsEl.textContent = "0";
